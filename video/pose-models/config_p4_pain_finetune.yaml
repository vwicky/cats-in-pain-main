# P4 binary pairs: finetune from a pretrained Paining–Resting (or other) checkpoint.
# - First ``freeze_backbone_epochs``: encoder frozen, heads + sweep LR on binary loss.
# - Then full model, ``unfreeze_lr`` (cosine rescheduled over remaining max epochs).
#
# Default ``init_weights`` points at gs0030 (Paining vs Resting sweep cell); override via CLI
# or edit ``training.init_weights_path``.

data:
  manifest: "src/dataset_construction/manifests/final_dataset_v2.jsonl"
  pose_v1_dir: "data/dataset/embeddings/pose/labeled"
  pose_v2_dir: "data/dataset/embeddings/pose/v2"
  pose_extraction_index: "src/dataset_construction/reports/pose_extraction_index.jsonl"
  vitpose_qc:
    filter: true
    enrichment: "src/dataset_construction/reports/vitpose_qc_enrichment.jsonl"
    default_ok_if_missing: true
    attach_enrichment_columns: true
  n_frames: 35
  n_keypoints: 17
  n_channels: 3
  pose_cache:
    backend: ram

labels:
  classes:
    - Angry
    - Defence
    - Fighting
    - Happy
    - HuntingMind
    - Mating
    - MotherCall
    - Paining
    - Resting
    - Warning
  binary_pain_class: "Paining"
  label_field: "audio_label_10"
  confidence_field: "audio_high_confidence"

normalization:
  root_joint: 0
  scale_joints: [5, 6]
  clamp_xy: [-0.5, 1.5]
  drop_low_confidence_frames: true
  confidence_threshold: 0.10

split:
  n_folds: 5
  random_state: 42
  group_field: "cat_id"
  stratify_field: "audio_label_10"

# gs0030: lr=5e-5, batch=8, wd=0.05, gam=0, cosine (from sweep path gs0030_...)
training:
  batch_size: 8
  lr: 0.00005
  weight_decay: 0.05
  optimizer: "adamw"
  scheduler: "cosine"
  focal_gamma: 0.0
  use_class_weights: true
  epochs: 1000
  early_stop_metric: "val_macro_f1_binary"
  early_stop_patience: 100
  early_stop_min_delta: 0.0
  grad_clip_norm: 1.0
  # Pretrained P4 (same 17-kp ST-GCN) — .pth with state_dict only, or best_model dict
  init_weights_path: "video/pose-models/runs/p4_sweep_paining_restsing_20260423_235721/hparams_grid/gs0030_lr5e-05_bs8_wd0.05_g0.0_cosine/binary__Paining__Resting/training/best_weights.pth"
  freeze_backbone_epochs: 20
  unfreeze_lr: 0.00001

output:
  runs_dir: "video/pose-models/runs"
  log_interval_batches: 20
