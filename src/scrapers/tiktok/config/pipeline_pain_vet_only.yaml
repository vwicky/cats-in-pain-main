# Pain / vet / injury / “paining” cats only — no Agonistic, Vocalizing, Positive_Baseline, or HuntingMind
# hashtag generation or scraping. GPT + Playwright only surface Pain/Vet query rows.
#
# Launch: src/scrapers/tiktok/scripts/run_pain_vet_only.sh
#
run_name: "tiktok_pipeline_run_painvet"
run_notes: "Pain/Vet only; expanded hashtag count + more videos/tag; cat token; prior-hashtag avoid"

search:
  # Only this behavioral bucket (sick cat, vet, pain, injury, surgery, emergency, etc.).
  behavior_categories:
    - Pain/Vet
  # Pain/Vet-only: n_pain = max(seed_queries_per_category, round(seed × pain_vet_hashtag_boost)).
  # e.g. 90 × 1.5 → 135 distinct GPT hashtags per run (more query samples, still pain-focused).
  seed_queries_per_category: 300
  languages_per_query: 24
  # More video links collected per hashtag page (Playwright scroll cap).
  max_results_per_query: 300
  openai_api_key: ""
  query_generation_model: "gpt-4o-mini"
  query_generation_temperature: 0.72
  query_generation_require_cat_token: true
  pain_vet_hashtag_boost: 3
  query_generation_avoid_prior_hashtags: true
  prior_hashtag_hints_max: 500
  prior_hashtag_hints_max_chars: 12000
  deduplicate_across_queries: true
  # Leave empty if cookies.txt is not valid Netscape format (otherwise yt-dlp errors + TikTok 403).
  # Prefer metadata_enrich.cookies_from_browser for the enrich stage.
  cookie_file: ""
  cookies_from_browser: ""
  tiktok_app_info: ""
  playwright:
    headless: false
    goto_timeout_ms: 20000
    wait_for_video_timeout_ms: 60000
    post_goto_sleep_sec: 3
    max_scroll_attempts: 10
    scroll_pause_sec: 2.5
    wheel_delta_y: 3000
    viewport_width: 1280
    viewport_height: 720
    user_data_dir: "src/scrapers/tiktok/tiktok_profile"
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  extra_seed_urls: []
  target_languages:
    - "English"
    - "Ukrainian"
    - "Russian"
    - "French"
    - "German"
    - "Spanish"
    - "Japanese"
    - "Thai"
    - "Arabic"
    - "Portuguese"
    - "Korean"
    - "Italian"
    - "Polish"
    - "Turkish"
    - "Hindi"
    - "Vietnamese"
    - "Dutch"
    - "Indonesian"
    - "Czech"
    - "Romanian"
    - "Swedish"
    - "Norwegian"
    - "Greek"
    - "Hebrew"
    - "Malay"
    - "Tagalog"
    - "Hungarian"
    - "Bengali"
    - "Finnish"
    - "Danish"
    - "Slovak"
    - "Persian"

metadata_enrich:
  enabled: true
  only_when_empty: true
  # Fewer parallel calls + delay reduces TikTok HTTP 403 during extract_info.
  parallel_workers: 2
  sleep_interval: 2.5
  max_retries: 4
  socket_timeout_sec: 45
  cookie_file: ""
  # Browser where you are logged into tiktok.com (chrome, safari, firefox, chromium, edge, …).
  cookies_from_browser: "chrome"

tag_filter:
  reject_title_keywords:
    - "minecraft"
    - "fortnite"
    - "gameplay"
    - "cartoon"
    - "animation"
    - "cgi"
  reject_description_keywords: []
  require_min_duration_sec: 1
  require_max_duration_sec: 120
  reject_if_track_title_keywords:
    - "official music video"
    - "mv"
  discard_trending_sound_only_when_no_text: false

gpt_filter:
  model: "gpt-4o-mini"
  system_prompt_file: "src/scrapers/tiktok/config/gpt_filter_system_prompt.md"
  user_prompt_prefix_file: "src/scrapers/tiktok/config/gpt_filter_user_prompt_prefix.md"
  batch_size: 10
  parallel_workers: 5
  max_retries: 3
  temperature: 0.0
  openai_api_key: ""
  cost_estimate_per_1k_tokens: 0.000150

download:
  sleep_interval: 2
  max_sleep_interval: 5
  max_clip_seconds: 120
  absolute_max_duration_seconds: 120
  min_clip_seconds: 1
  max_filesize_bytes: 524288000
  max_height: 1080
  audio_format: "mp3"
  audio_quality: "192"
  retries: 3
  fragment_retries: 3
  cookie_file: ""
  cookies_from_browser: ""
  tmp_dir: "src/scrapers/tiktok/tmp_downloads"
  output_dir: "data/dataset/tiktok_videos"
  legacy_dataset_jsonl: "data/dataset/tiktok_final_dataset.jsonl"

yolo:
  weights: "models/yolo/yolov8m.pt"
  conf: 0.5
  imgsz: 640
  cat_class_id: 15
  min_segment_duration: 3.0
  min_chunk_duration: 3.0
  max_chunk_duration: 7.0
  frame_skip: 4
  require_single_cat: true
  processing_timeout_sec: 300
  processing_workers: 1
  parallel_yolo_device: "mps"
  delete_source_media_after_processing: false
  skip_videos_already_in_metadata: true

audio:
  backend: yamnet
  cat_prob_threshold: 0.65
  yamnet_patch_batch_size: 32
  yamnet_aggregate_cat_classes: sum
  yamnet_include_roaring_cats: false
  model_path: models/audio_preclassifier/voting_classifier_with-add-data.pkl
  v2_model_path: _archive/audio_preclassifier_v2/runs/run_20260408_221318/best_model.pkl
  prefer_v2: true
  feature_set: mfcc_delta_spectral
  waveform_normalize: none
  waveform_normalize_eps: 1.0e-09
  waveform_normalize_noise_floor: 0.01
  waveform_normalize_rms_target: 0.1
  predict_temp_dir: ""

output:
  snippets_dir: "data/dataset/tiktok_snippets"
  metadata_file: "data/dataset/tiktok_metadata.jsonl"
  pipeline_log: "src/scrapers/tiktok/logs/pipeline_log.jsonl"
  runs_dir: "src/scrapers/tiktok/runs"

reporting:
  log_interval: 10
  save_plots: true
