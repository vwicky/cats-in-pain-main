# ── Identity ─────────────────────────────────────────────────
# Smaller YouTube run than pipeline.yaml (split-6 batch): fewer seeds × fewer languages
# so search/GPT/download/process stay lighter (~0.64× expanded queries vs 300×15).
run_name: "pipeline_v2_run_moderate"
run_notes: "Moderate YouTube crawl: 240 EN seeds × 12 langs; Pain/Vet still 2× other categories"

# ── Stage 1: Search ──────────────────────────────────────────
search:
  # Was 50/100 (300 seeds); 40/80 → 240 seeds (~20% fewer seeds).
  seed_queries_per_category: 40
  seed_queries_per_category_pain_vet: 80
  # Was 15; 12 languages cuts translation/API + YouTube queries without dropping core locales.
  languages_per_query: 12
  max_results_per_query: 40
  youtube_api_key: ""
  openai_api_key: ""
  query_generation_model: "gpt-4o-mini"
  seed_generation_temperature: 0.58
  translation_temperature: 0.35
  deduplicate_across_queries: true
  youtube_search_workers: 8
  random_sample_queries: 0
  random_sample_seed: null
  output_file: "logs/v2_candidates.jsonl"
  target_languages:
    - "English"
    - "Ukrainian"
    - "Russian"
    - "French"
    - "German"
    - "Spanish"
    - "Japanese"
    - "Thai"
    - "Arabic"
    - "Portuguese"
    - "Korean"
    - "Italian"
    - "Polish"

# ── Stage 2: Tag filter ──────────────────────────────────────
tag_filter:
  allowed_categories:
    - "Pets & Animals"
    - "Entertainment"
    - "People & Blogs"
    - "Education"
    - "Howto & Style"
    - "Nonprofits & Activism"
    - null
  reject_title_keywords:
    - "for cats to watch"
    - "cat tv"
    - "cartoon"
    - "animation"
    - "cgi"
    - "minecraft"
    - "game"
    - "virtual"
    - "compilation of compilations"
    - "reaction"
    - "singing"
  require_min_duration_sec: 10
  require_max_duration_sec: 300
  output_file: "logs/v2_tag_filtered.jsonl"

# ── Stage 3: GPT filter ──────────────────────────────────────
gpt_filter:
  model: "gpt-4o-mini"
  rules_file: "src/scrapers/data_pipeline_v2/config/gpt_filter_rules.md"
  batch_size: 10
  gpt_filter_workers: 5
  max_retries: 3
  temperature: 0.0
  openai_api_key: ""
  output_file: "logs/v2_gpt_filtered.jsonl"
  cost_estimate_per_1k_tokens: 0.000150

# ── Stage 4: Download ────────────────────────────────────────
download:
  max_duration_seconds: 300
  max_filesize_bytes: 524288000
  max_height: 1080
  audio_format: "mp3"
  audio_quality: "192"
  retries: 3
  fragment_retries: 3
  cookie_file: ""
  cookies_from_browser: ""
  remote_components:
    - "ejs:github"
  tmp_dir: "src/scrapers/data_pipeline_v2/tmp_downloads"
  output_dir: "data/dataset/videos_v2"
  legacy_dataset_jsonl: "data/dataset/final_dataset.jsonl"

# ── Stage 5: YOLO processing ────────────────────────────────
yolo:
  weights: "models/yolo/yolov8m.pt"
  conf: 0.50
  imgsz: 640
  cat_class_id: 15
  min_segment_duration: 3.0
  min_chunk_duration: 3.0
  max_chunk_duration: 7.0
  frame_skip: 6
  require_single_cat: true
  processing_timeout_sec: 300
  processing_workers: 1
  parallel_yolo_device: "mps"
  delete_source_media_after_processing: true

# ── Stage 6: Audio classifier ───────────────────────────────
audio:
  backend: yamnet
  cat_prob_threshold: 0.65
  yamnet_patch_batch_size: 32
  yamnet_aggregate_cat_classes: sum
  yamnet_include_roaring_cats: false
  model_path: "models/audio_preclassifier/voting_classifier_with-add-data.pkl"
  v2_model_path: "_archive/audio_preclassifier_v2/runs/run_20260408_221318/best_model.pkl"
  prefer_v2: true
  feature_set: "mfcc_delta_spectral"
  waveform_normalize: none
  waveform_normalize_eps: 1.0e-9
  waveform_normalize_noise_floor: 0.01
  waveform_normalize_rms_target: 0.1

# ── Output ───────────────────────────────────────────────────
output:
  snippets_dir: "data/dataset/snippets_v2"
  metadata_file: "data/dataset/metadata_v2.jsonl"
  pipeline_log: "logs/v2_pipeline_log.jsonl"
  runs_dir: "src/scrapers/data_pipeline_v2/runs"

# ── Reporting ────────────────────────────────────────────────
reporting:
  log_interval: 10
  save_plots: true
  report_file: "reports/pipeline_v2_report.txt"
