services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catpain_web
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: website/Dockerfile
    working_dir: /workspace/website
    command: >
      uvicorn backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ..:/workspace:rw
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/catpain_web
      REPO_ROOT: /workspace
      DATA_DIR: /workspace/website/data
      PYTHONPATH: /workspace/website
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: website/Dockerfile
    working_dir: /workspace/website
    command: python worker/runner.py
    volumes:
      - ..:/workspace:rw
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/catpain_web
      REPO_ROOT: /workspace
      DATA_DIR: /workspace/website/data
      PYTHONPATH: /workspace/website
    depends_on:
      postgres:
        condition: service_healthy
